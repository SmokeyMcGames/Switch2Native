name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build, tests and INF validation
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and validate
        shell: powershell
        run: .\tools\Build.ps1
      - name: Installer policy and device-helper checks (read only)
        shell: powershell
        run: .\tests\installer_tests.ps1
      - name: Build development preview installer
        shell: powershell
        run: |
          .\tools\Prepare-Package.ps1
          $compiler = .\tools\Get-InnoCompiler.ps1
          .\tools\Build-Installer.ps1 -IsccPath $compiler
      - name: Upload setup and corresponding source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Switch2NativeControllerDriver-preview-x64
          path: |
            out/installer/*-Preview-Setup-x64.exe
            out/installer/*-source.zip
            out/installer/build-info.json
            out/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
